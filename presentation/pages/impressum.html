<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SplitIt - Impressum</title>
    <link rel="icon" type="image/icon" href="/images/favicon.ico">
    <style>
        body {
            font-family: 'Tahoma', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-size: cover;
            background-attachment: fixed;
            background-color: #f0f0f0;
        }

        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 100px;
            background-color: rgba(255, 255, 255, 0.9); /* Slightly transparent white background */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            max-width: 800px; /* Max width for the container */
            margin: auto; /* Center the container horizontally */
            max-height: 300px;
        }

        .title {
            font-size: 3em;
            color: #0056b3;
            font-weight: bolder;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            margin-top: 40px;
        }
        header img {
            max-width: 150px;
            height: auto;
            margin-right: 20px;
        }
        h1 {
            margin-top: 0;
        }
        .content {
            max-width: 600px;
            text-align: center;
            line-height: 1.6;
        }
        footer {
            width: 100%;
            padding: 10px 0;
            background-color: #333; /* Gray background */
            color: #fff; /* White text */
            text-align: center;
        }
        footer a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
        }
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<header>
    <img src="/images/favicon.ico" alt="SplitIt Logo">
    <div class="title">SplitIt!</div>
</header>
<div class="container">
    <h1>Impressum</h1>
    <div class="content">
        <h2>Contact Information</h2>
        <div style="margin-top: 40px; font-weight: bold"> <a href="mailto:[info@lab64.eu]">info@lab64.eu</a></div>
    </div>
</div>

<footer>
    <a href="/privacy-policy">Privacy Policy</a> |
    <a href="/impressum">Impressum</a>
</footer>
</body>
</html>
